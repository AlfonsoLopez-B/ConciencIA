<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Espacio Pausa</title>
  <style>
    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #f2f1eb;
      color: #26134b;
      position: relative;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 320"><path fill="%2326d1c8" fill-opacity="0.2" d="M0,128L48,138.7C96,149,192,171,288,181.3C384,192,480,192,576,181.3C672,171,768,149,864,144C960,139,1056,149,1152,154.7C1248,160,1344,160,1392,160L1440,160L1440,320L1392,320C1344,320,1248,320,1152,320C1056,320,960,320,864,320C768,320,672,320,576,320C480,320,384,320,288,320C192,320,96,320,48,320L0,320Z"></path><path fill="%23383838" fill-opacity="0.1" d="M0,192L48,181.3C96,171,192,149,288,144C384,139,480,149,576,154.7C672,160,768,160,864,160C960,160,1056,160,1152,160C1248,160,1344,160,1392,160L1440,160L1440,320L1392,320C1344,320,1248,320,1152,320C1056,320,960,320,864,320C768,320,672,320,576,320C480,320,384,320,288,320C192,320,96,320,48,320L0,320Z"></path></svg>') repeat-x bottom;
      z-index: -1;
    }

    body::after {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(to right, rgba(38, 209, 200, 0.3) 0%, transparent 10%, transparent 90%, rgba(38, 209, 200, 0.3) 100%), linear-gradient(to left, rgba(56, 56, 56, 0.2) 0%, transparent 5%, transparent 95%, rgba(56, 56, 56, 0.2) 100%);
      z-index: -1;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 30px;
      background-color: #383838;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 999;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
      transition: all 0.3s ease;
      height: 80px;
    }

    header.scrolled {
      padding: 10px 20px;
      height: 50px;
    }

    .logo img {
      width: 260px;
      height: auto;
      transition: width 0.3s ease;
    }

    header.scrolled .logo img {
      width: 170px;
    }

    .titulo {
      position: absolute;
      left: 150px;
      font-size: 24px;
      font-weight: bold;
      color: #f2f1eb;
      transition: font-size 0.3s ease;
    }

    header.scrolled .titulo {
      font-size: 18px;
    }

    nav {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-left: auto;
      margin-right: 30px;
      transition: gap 0.3s ease;
    }

    header.scrolled nav {
      gap: 15px;
    }

    nav a {
      position: relative;
      text-decoration: none;
      color: #f2f1eb;
      font-weight: bold;
      font-size: 16px;
      padding: 8px 12px;
      transition: all 0.3s ease;
    }

    header.scrolled nav a {
      font-size: 14px;
      padding: 6px 10px;
    }

    nav a:hover, nav a.active {
      color: #26d1c8;
    }

    nav a.active::after {
      content: '';
      position: absolute;
      bottom: -2px;
      left: 0;
      width: 100%;
      height: 2px;
      background-color: #26d1c8;
    }

    .dropdown {
      position: relative;
    }

    .dropdown:hover .dropdown-content {
      display: block;
      opacity: 1;
      transform: translateY(0);
    }

    .dropdown-content {
      display: none;
      position: absolute;
      top: 100%;
      left: 0;
      background-color: #383838;
      min-width: 200px;
      box-shadow: 0 8px 12px rgba(0,0,0,0.3);
      z-index: 1000;
      border-radius: 8px;
      opacity: 0;
      transform: translateY(-10px);
      transition: opacity 0.3s ease, transform 0.3s ease;
    }

    .dropdown-content a {
      display: block;
      padding: 10px 15px;
      color: #f2f1eb;
      text-align: left;
      text-decoration: none;
      font-size: 14px;
      transition: all 0.3s ease;
    }

    .dropdown-content a:hover {
      background-color: #1e1c22;
      color: #26d1c8;
    }

    section {
      padding: 100px 40px 80px;
      max-width: 1000px;
      margin: 0 auto;
      background-color: rgba(242, 241, 235, 0.95);
      border-radius: 12px;
      box-shadow: 0 6px 15px rgba(38, 209, 200, 0.3);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      position: relative;
      z-index: 1;
    }

    section:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 20px rgba(38, 209, 200, 0.4);
    }

    section h2 {
      font-size: 24px;
      color: #383838;
      margin-bottom: 16px;
      position: relative;
      padding-bottom: 8px;
    }

    section h2::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      width: 50px;
      height: 3px;
      background-color: #26d1c8;
    }

    section p, section li {
      font-size: 14px;
      color: #383838;
      line-height: 1.8;
    }

    section ul {
      margin: 0 0 20px 20px;
      padding-left: 20px;
    }

    section li {
      margin-bottom: 10px;
    }

    .audio-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .audio-list li {
      margin-bottom: 8px;
    }

    .audio-list button {
      width: 100%;
      padding: 10px;
      font-size: 14px;
      background-color: #383838;
      color: #f2f1eb;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.3s, transform 0.2s;
      font-weight: bold;
      text-align: left;
    }

    .audio-list button:hover {
      background-color: #26d1c8;
      transform: scale(1.02);
    }

    .main-container {
      display: grid;
      grid-template-columns: 1fr 250px;
      gap: 20px;
      max-width: 1000px;
      width: 90%;
      margin: 0 auto;
    }

    .content-container {
      background-color: #383838;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 6px 15px rgba(38, 209, 200, 0.3);
      display: flex;
      flex-direction: column;
    }

    .image-container {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 20px;
    }

    .image-container img {
      max-width: 100%;
      max-height: 400px;
      object-fit: contain;
      border-radius: 8px;
    }

    .audio-container {
      width: 100%;
    }

    audio {
      width: 100%;
      outline: none;
      background-color: #f2f1eb;
      border-radius: 10px;
    }

    .audio-selector {
      max-height: 400px;
      overflow-y: auto;
      background-color: rgba(242, 241, 235, 0.95);
      border-radius: 12px;
      padding: 15px;
      box-shadow: 0 6px 15px rgba(38, 209, 200, 0.3);
    }

    .audio-selector::-webkit-scrollbar {
      width: 8px;
    }

    .audio-selector::-webkit-scrollbar-track {
      background: rgba(0, 0, 0, 0.2);
      border-radius: 10px;
    }

    .audio-selector::-webkit-scrollbar-thumb {
      background: #26d1c8;
      border-radius: 10px;
    }

    .audio-selector::-webkit-scrollbar-thumb:hover {
      background: #1e9c94;
    }

    .spacer {
      height: 100px;
    }

    @media (max-width: 768px) {
      .main-container {
        grid-template-columns: 1fr;
        grid-template-rows: auto auto;
      }

      .content-container, .audio-selector {
        max-width: 100%;
      }

      nav {
        margin-right: 10px;
        flex-wrap: wrap;
        gap: 10px;
      }

      nav a, .dropdown-content a {
        font-size: 14px;
        padding: 6px;
      }

      .titulo {
        left: 120px;
      }

      body::after {
        background: linear-gradient(to right, rgba(38, 209, 200, 0.3) 0%, transparent 5%, transparent 95%, rgba(38, 209, 200, 0.3) 100%);
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">
      <img src="Imagenes/logo_verde_b.png" alt="Logo">
    </div>
    <nav>
      <div class="dropdown">
        <a href="index.html#alcance">Nuestro Proyecto</a>
        <div class="dropdown-content">
          <a href="index.html#alcance">Alcance</a>
          <a href="index.html#marco-conceptual">Marco Conceptual</a>
          <a href="index.html#objetivos">Objetivos</a>
          <a href="index.html#metodologia">Metodología</a>
        </div>
      </div>
      <div class="dropdown">
        <a href="index.html#historia">Comics</a>
        <div class="dropdown-content">
          <a href="index.html#historia">Historia</a>
          <a href="index.html#personajes">Personajes</a>
          <a href="index.html#comics">Comics</a>
        </div>
      </div>
      <div class="dropdown">
        <a href="index.html#reglas">Juego</a>
        <div class="dropdown-content">
          <a href="index.html#reglas">Reglas</a>
          <a href="index.html#cartas">Cartas</a>
        </div>
      </div>
      <a href="#espacio-pausa">Espacio Pausa</a>
    </nav>
  </header>

  <div class="spacer"></div>

  <section id="espacio-pausa">
    <h2>Espacio Pausa</h2>
    <div class="main-container">
      <div class="content-container">
        <div class="image-container">
          <img id="audioImage" src="Imagenes/relajacion.jpg" alt="Imagen del audio">
        </div>
        <div class="audio-container">
          <audio id="audioPlayer" controls>
            <source src="Audios/mindfulness_relajacion.mp3" type="audio/mpeg">
            Tu navegador no soporta la reproducción de audio. Prueba con Chrome, Firefox o un navegador actualizado.
          </audio>
        </div>
      </div>
      <div class="audio-selector">
        <ul class="audio-list" id="audioList"></ul>
      </div>
    </div>
  </section>

  <script>
    // Lista de audios
    const audios = [
      { nombre: "Calma", audio: "Audios/1.mp3", imagen: "Imagenes/relajacion.jpg" },
      { nombre: "Dolor físico y emocional", audio: "Audios/2.mp3", imagen: "Imagenes/respiracion.jpg" },
      { nombre: "Limpieza energética", audio: "Audios/3.mp3", imagen: "Imagenes/matutina.jpg" },
      { nombre: "Sueño", audio: "Audios/4.mp3", imagen: "Imagenes/atencion.jpg" },
      { nombre: "Creatividad", audio: "Audios/5.mp3", imagen: "Imagenes/gratitud.jpg" },
      { nombre: "Calma y enfoque", audio: "Audios/6.mp3", imagen: "Imagenes/cuerpo.jpg" },
      { nombre: "Concentración", audio: "Audios/7.mp3", imagen: "Imagenes/silencio.jpg" },
      { nombre: "Intuición", audio: "Audios/8.mp3", imagen: "Imagenes/energia.jpg" },
      { nombre: "Claridad y aprendizaje", audio: "Audios/9.mp3", imagen: "Imagenes/sueno.jpg" },
      { nombre: "Cambiar 1", audio: "Audios/10.mp3", imagen: "Imagenes/natural.jpg" },
      { nombre: "Cambiar 2", audio: "Audios/11.mp3", imagen: "Imagenes/nocturna.jpg" },
      { nombre: "Cambiar 3", audio: "Audios/12.mp3", imagen: "Imagenes/foco.jpg" },
      { nombre: "Cambiar 4", audio: "Audios/13.mp3", imagen: "Imagenes/liberacion.jpg" },
      { nombre: "Cambiar 5", audio: "Audios/14.mp3", imagen: "Imagenes/paz.jpg" },
      { nombre: "Cambiar 6", audio: "Audios/15.mp3", imagen: "Imagenes/equilibrio.jpg" },
      { nombre: "Cambiar 7", audio: "Audios/16.mp3", imagen: "Imagenes/armonia.jpg" },
      { nombre: "Cambiar 8", audio: "Audios/17.mp3", imagen: "Imagenes/renovacion.jpg" },
      { nombre: "Cambiar 9", audio: "Audios/18.mp3", imagen: "Imagenes/fluir.jpg" },
      { nombre: "Cambiar 10", audio: "Audios/19.mp3", imagen: "Imagenes/consciencia.jpg" },
      { nombre: "Cambiar 11", audio: "Audios/20.mp3", imagen: "Imagenes/amor.jpg" },
      { nombre: "Cambiar 12", audio: "Audios/21.mp3", imagen: "Imagenes/resiliencia.jpg" },
      { nombre: "Cambiar 13", audio: "Audios/22.mp3", imagen: "Imagenes/claridad.jpg" },
      { nombre: "Cambiar 14", audio: "Audios/23.mp3", imagen: "Imagenes/sanacion.jpg" },
      { nombre: "Cambiar 15", audio: "Audios/24.mp3", imagen: "Imagenes/fuerza.jpg" },
      { nombre: "Cambiar 16", audio: "Audios/25.mp3", imagen: "Imagenes/tranquilidad.jpg" },
      { nombre: "Cambiar 17", audio: "Audios/26.mp3", imagen: "Imagenes/aceptacion.jpg" },
      { nombre: "Cambiar 18", audio: "Audios/27.mp3", imagen: "Imagenes/presencia.jpg" },
      { nombre: "Cambiar 19", audio: "Audios/28.mp3", imagen: "Imagenes/esperanza.jpg" },
      { nombre: "Sonidos Cuencos", audio: "Audios/sonidos_cuencos.mp3", imagen: "Imagenes/presencia.jpg" }
    ];

    // Generar lista de audios
    const audioList = document.getElementById("audioList");
    audios.forEach((audio, index) => {
      const li = document.createElement("li");
      const button = document.createElement("button");
      button.textContent = audio.nombre;
      button.onclick = () => cambiarAudio(index);
      li.appendChild(button);
      audioList.appendChild(li);
    });

    // Función para cambiar audio
    function cambiarAudio(index) {
      const audioData = audios[index];
      const audioPlayer = document.getElementById("audioPlayer");
      const image = document.getElementById("audioImage");
      audioPlayer.src = audioData.audio;
      image.src = audioData.imagen;
      image.alt = `Imagen de ${audioData.nombre}`;
      audioPlayer.load();
      audioPlayer.play();
    }

    // Leer parámetro de la URL y reproducir audio automáticamente
    window.onload = () => {
      const urlParams = new URLSearchParams(window.location.search);
      const id = parseInt(urlParams.get('id')) - 1;

      if (id >= 0 && id < audios.length) {
        cambiarAudio(id);
        document.getElementById("espacio-pausa").scrollIntoView({ behavior: 'smooth' });
      }

      // Resaltar sección activa en el menú
      const navLinks = document.querySelectorAll('nav a');
      navLinks.forEach(link => {
        link.classList.remove('active');
        if (link.getAttribute('href') === '#espacio-pausa') {
          link.classList.add('active');
        }
      });
    };

    // Reducir encabezado al hacer scroll
    window.addEventListener('scroll', () => {
      const header = document.querySelector('header');
      if (header) {
        if (window.scrollY > 50) {
          header.classList.add('scrolled');
        } else {
          header.classList.remove('scrolled');
        }
      }

      // Resaltar sección activa
      const sections = document.querySelectorAll('section');
      const navLinks = document.querySelectorAll('nav a');
      let currentSection = '';

      sections.forEach(section => {
        const sectionTop = section.offsetTop;
        if (window.scrollY >= sectionTop - 100) {
          currentSection = section.getAttribute('id');
        }
      });

      navLinks.forEach(link => {
        link.classList.remove('active');
        if (link.getAttribute('href').slice(1) === currentSection) {
          link.classList.add('active');
        }
      });
    });
  </script>
</body>
</html>
