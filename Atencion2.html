<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Pausa Conexión - Imagen especial de Conciencia IA">
  <meta name="keywords" content="conciencia, pausa, conexión">
  <title>Pausa Conexión - Imagen Especial</title>
  <link rel="preload" href="Imagenes/imagen_especial.png" as="image">
  <style>
    :root {
      --primary-bg: #f2f1eb;
      --primary-text: #26134b;
      --secondary-bg: #383838;
      --accent-color: #26d1c8;
      --accent-hover: #1e9c94;
      --white: #ffffff;
      --shadow-light: rgba(38, 209, 200, 0.3);
      --shadow-medium: rgba(38, 209, 200, 0.4);
      --shadow-dark: rgba(0, 0, 0, 0.3);
      --transition-medium: 0.3s ease;
      --border-radius: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      font-size: 16px;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--primary-bg);
      color: var(--primary-text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: 
        radial-gradient(circle at 20% 80%, rgba(38, 209, 200, 0.15) 0%, transparent 50%),
        radial-gradient(circle at 80% 20%, rgba(38, 209, 200, 0.1) 0%, transparent 50%);
      z-index: -1;
    }

    .image-container {
      max-width: 90%;
      margin: 2rem;
      padding: 1.5rem;
      background: linear-gradient(135deg, rgba(242, 241, 235, 0.95) 0%, rgba(242, 241, 235, 0.98) 100%);
      border-radius: var(--border-radius);
      box-shadow: 0 6px 15px var(--shadow-light);
      transition: all var(--transition-medium);
      text-align: center;
    }

    .image-container img {
      max-width: 100%;
      max-height: 80vh;
      object-fit: contain;
      border-radius: var(--border-radius);
      box-shadow: 0 6px 15px rgba(0, 0, 0, 0.3);
      transition: transform var(--transition-medium);
    }

    .image-container img:hover {
      transform: scale(1.05);
    }

    .image-container::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg, var(--accent-color), var(--accent-hover));
      border-radius: var(--border-radius) var(--border-radius) 0 0;
    }

    @media (max-width: 768px) {
      .image-container {
        margin: 1rem;
        padding: 1rem;
      }
      .image-container img {
        max-height: 70vh;
      }
    }

    @media (max-width: 480px) {
      .image-container {
        margin: 0.5rem;
        padding: 0.75rem;
      }
      .image-container img {
        max-height: 60vh;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .image-container img {
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <div class="image-container">
    <img src="imagenesAte/Granjero.png" alt="Imagen Especial de Conciencia IA" loading="lazy">
  </div>
</body>
</html>
